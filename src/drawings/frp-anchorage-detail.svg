<svg class="dwg" viewBox="0 0 640 480" role="img" aria-labelledby="frp-anchorage-detail-title frp-anchorage-detail-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="frp-anchorage-detail-title">Horizontal FRP bio-filter tank anchored against a high water table</title>
  <desc id="frp-anchorage-detail-desc">End section through an anchor strap of a horizontal FRP bio-filter tank, cut through the tank legs, with the groundwater table above the tank invert. The tank stands on a 150 mm grade 30 N concrete base with one layer of BRC-A9 mesh, on 50 mm lean concrete. The base edge sits 300 to 600 mm from the pit wall, the working space. A 20 mm SS304 strap passes over the tank and is tightened with a stainless steel turnbuckle just above a 12 mm stainless steel hook cast in the base, so buoyancy is resisted by the straps and the base. The tank is filled with water to top water level before sand backfill is compacted in 150 mm layers. A 100 mm 1:2:4 concrete slab with BRC-A9 mesh covers the tank, with brick sump manhole necks and covers above. An inset long section, not to scale, shows the two necks, the straps, the top water level and the 150 mm inlet and outlet pipes laid at a 1:100 fall. Invert levels are to be confirmed. Tank internals are omitted.</desc>
