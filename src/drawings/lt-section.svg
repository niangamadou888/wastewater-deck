<svg class="dwg" viewBox="0 0 640 422" role="img" aria-labelledby="lt-section-title lt-section-desc" xmlns="http://www.w3.org/2000/svg">
<title id="lt-section-title">Typical section, LT small sewage treatment system (40 to 150 PE)</title>
<desc id="lt-section-desc">Horizontal FRP tank with two compartments, in a sand-backfilled pit on a reinforced concrete base, under a concrete slab with two manholes. Sewage enters the aerobic reactor tank (ART) at the right, drops into the lower anaerobic settling zone and rises through the aerobic up-chamber, where a diffuser fed by blowers at grade (1 duty, 1 standby) releases air. A transfer pipe at the top of the sloped partition carries it into the final settlement tank (FST). Clarified effluent passes under the outlet baffle and leaves by the outlet pipe at the left, which sits lower than the inlet. Dimensions L, H1 (overall height) and H2 (water level) are given per model in the schedule; invert levels are to be confirmed.</desc>
